<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Skunk Delver</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: ui-monospace, Menlo, Consolas, monospace; background:#0b0b0b; color:#eaeaea; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
    .top { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
    .panel { border:1px solid #1f1f1f; border-radius:14px; padding:14px; background: rgba(255,255,255,0.03); }
    canvas { border:1px solid #1f1f1f; border-radius:14px; background:#0f0f0f; image-rendering: pixelated; }
    h1 { margin:0 0 8px; letter-spacing:2px; }
    .mut { color:#a0a0a0; font-size: 12px; line-height: 1.35; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    button, select {
      background:#111; color:#eaeaea; border:1px solid #2a2a2a; border-radius:12px;
      padding:10px 12px; cursor:pointer;
    }
    button:hover, select:hover { border-color:#00ff99; }
    .pill { display:inline-block; padding:6px 10px; border:1px solid #2a2a2a; border-radius:999px; font-size:12px; color:#a0a0a0;}
    .log { height: 180px; overflow:auto; white-space: pre-wrap; font-size: 12px; line-height: 1.35; }
    a { color:#00ff99; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>SKUNK DELVER</h1>
        <div class="mut">Turn-based micro-roguelike. Move = your turn. Attack = your turn. Enemy acts after you.</div>
      </div>
      <div class="row" style="margin-left:auto">
        <a class="pill" href="/games/">← back to arcade</a>
      </div>
    </div>

    <div class="top" style="margin-top:14px">
      <canvas id="c" width="640" height="480"></canvas>

      <div class="panel" style="flex:1; min-width: 260px;">
        <div class="row" style="align-items:center; justify-content:space-between;">
          <div>
            <div class="pill" id="classPill">Class: ?</div>
            <div class="pill" id="turnPill">Turn: 1</div>
          </div>
          <button id="restartBtn">Restart</button>
        </div>

        <div style="margin-top:12px" class="row">
          <select id="classSelect">
            <option value="knight">Knight (melee cone)</option>
            <option value="barbarian">Barbarian (sweep)</option>
            <option value="archer">Archer (line, range)</option>
            <option value="mage">Mage (AoE pulse)</option>
          </select>
          <button id="pickBtn">Pick Class</button>
        </div>

        <div style="margin-top:12px" class="mut">
          Controls: <b>WASD / Arrow keys</b> to move. <b>Space</b> to attack. <b>R</b> restart. <br>
          Tip: try different classes — they feel different immediately.
        </div>

        <div style="margin-top:12px" class="panel log" id="log"></div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
