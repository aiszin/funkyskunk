<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>arcade — funky skunk</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <div class="card">
      <div class="tag">ARCADE</div>
      <h1>games</h1>
      <p class="sub">small releases. short runs. permadeath (usually).</p>

      <div id="list" class="row"></div>

      <p class="tiny"><a class="btn ghost" href="/">back</a></p>
    </div>
  </main>

  <script>
    fetch("/games/games.json")
      .then(r => r.json())
      .then(games => {
        const list = document.getElementById("list");
        games.forEach(g => {
          const a = document.createElement("a");
          a.className = "btn ghost";
          a.href = g.path;
          a.textContent = `${g.title} — ${g.author}`;
          list.appendChild(a);
        });
      })
      .catch(() => {
        document.getElementById("list").textContent =
          "no games yet. add one in /games and list it in games.json";
      });
  </script>
</body>
</html>
